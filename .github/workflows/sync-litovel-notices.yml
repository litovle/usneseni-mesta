name: Synchronizace úřední desky

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Scan and report without downloading or opening pull requests
        required: false
        default: "false"
        type: boolean
  schedule:
    - cron: "30 5 * * *"

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: sync-litovel-notices
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      CLASSIFIER_URL: ${{ vars.RESOLUTION_CLASSIFIER_URL || 'https://github.com/honza-kasik/litovel-resolution-classifier/releases/download/v1.0.0/litovel-resolution-classifier-v1.0.0.tar.gz' }}
      CLASSIFIER_SHA256: ${{ vars.RESOLUTION_CLASSIFIER_SHA256 || '6ad39105467ebd487349bb9b3ef6f2ea5ffcdf360ae1ac1190d410d7ebc0d69a' }}

    steps:
      - name: Checkout usneseni-mesta
        uses: actions/checkout@v5
        with:
          path: usneseni-mesta

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: usneseni-mesta/requirements.txt

      - name: Install dependencies
        working-directory: usneseni-mesta
        run: |
          python -m pip install 'torch>=2.2,<3' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements.txt

      - name: Scan notice board
        id: scan
        working-directory: usneseni-mesta
        env:
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || 'false' }}
        run: |
          args=(
            --manifest .litovel-sync-manifest.json
            --pr-body .litovel-sync-pr-body.md
          )
          if [ "$DRY_RUN" = "true" ]; then
            args+=(--dry-run)
          fi
          python tools/sync_litovel_notices.py "${args[@]}"

      - name: Stop when nothing new was found
        if: steps.scan.outputs.found != 'true'
        run: echo "No new Litovel resolution or budget-change PDFs found."

      - name: Checkout litovle.cz
        if: steps.scan.outputs.found == 'true' && steps.scan.outputs.dry_run != 'true'
        uses: actions/checkout@v5
        with:
          repository: honza-kasik/litovle.cz
          token: ${{ secrets.LITOVLE_CZ_PAT }}
          path: litovle.cz

      - name: Cache final resolution classifier
        if: steps.scan.outputs.found == 'true' && steps.scan.outputs.dry_run != 'true'
        uses: actions/cache@v5
        with:
          path: usneseni-mesta/.cache/resolution-classifier
          key: ${{ runner.os }}-resolution-classifier-${{ env.CLASSIFIER_SHA256 }}-${{ hashFiles('usneseni-mesta/resolution_classification/final-v1/manifest.json') }}

      - name: Parse new PDFs and regenerate export
        if: steps.scan.outputs.found == 'true' && steps.scan.outputs.dry_run != 'true'
        working-directory: usneseni-mesta
        run: |
          python - <<'PY'
          import json
          import os
          import subprocess
          import sys
          from pathlib import Path

          manifest = json.loads(Path(".litovel-sync-manifest.json").read_text(encoding="utf-8"))
          for item in manifest["downloaded"]:
              path = item["path"]
              if item["kind"] == "budget_change":
                  subprocess.run(
                      [sys.executable, "parse_rozpoctova_opatreni.py", path, "work/rozpoctova-opatreni"],
                      check=True,
                  )
              elif item["kind"] == "resolution":
                  subprocess.run(
                      [sys.executable, "phase1_parse_pdf.py", path, "work/phase1"],
                      check=True,
                  )
              else:
                  raise SystemExit(f"Unknown synced document kind: {item['kind']}")

          subprocess.run(
              [
                  sys.executable,
                  "pipeline.py",
                  "--classifier-url",
                  os.environ["CLASSIFIER_URL"],
                  "--classifier-sha256",
                  os.environ["CLASSIFIER_SHA256"],
                  "--pdf",
                  "resources",
                  "--ro-pdf",
                  "resources/rozpoctova-opatreni",
                  "--workdir",
                  "work",
                  "--export",
                  "../litovle.cz",
                  "--from-phase",
                  "3",
                  "--to-phase",
                  "9",
              ],
              check=True,
          )
          PY

      - name: Build pull request body output
        if: steps.scan.outputs.found == 'true'
        id: pr_body
        working-directory: usneseni-mesta
        run: |
          {
            echo "body<<EOF"
            cat .litovel-sync-pr-body.md
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create usneseni-mesta pull request
        if: steps.scan.outputs.found == 'true' && steps.scan.outputs.dry_run != 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.LITOVLE_CZ_PAT }}
          path: usneseni-mesta
          branch: litovel-notice-sync/${{ github.run_id }}
          delete-branch: true
          title: Sync Litovel notices
          commit-message: Sync Litovel notices
          author: robot-honza <293300540+robot-honza@users.noreply.github.com>
          committer: robot-honza <293300540+robot-honza@users.noreply.github.com>
          body: ${{ steps.pr_body.outputs.body }}
          reviewers: honza-kasik
          add-paths: |
            resources
            work

      - name: Create litovle.cz pull request
        if: steps.scan.outputs.found == 'true' && steps.scan.outputs.dry_run != 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.LITOVLE_CZ_PAT }}
          path: litovle.cz
          branch: litovel-notice-sync/${{ github.run_id }}
          delete-branch: true
          title: Sync Litovel notices
          commit-message: Sync generated Litovel notice export
          author: robot-honza <293300540+robot-honza@users.noreply.github.com>
          committer: robot-honza <293300540+robot-honza@users.noreply.github.com>
          body: ${{ steps.pr_body.outputs.body }}
          reviewers: honza-kasik

      - name: Create failure issue
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          existing=$(gh issue list \
            --state open \
            --assignee honza-kasik \
            --search "Synchronizace úřední desky selhala in:title" \
            --json number \
            --jq '.[0].number // empty' 2>/dev/null || true)

          body=$(mktemp)
          {
            echo "Automatická synchronizace úřední desky selhala."
            echo
            echo "Běh workflow: $RUN_URL"
            echo
            echo "Pokud web Litovle vyžaduje ruční kontrolu, stáhni PDF ručně, přilož ho do issue/komentáře a spusť workflow \`Zpracování ručně přidaného PDF\` s URL přílohy."
          } > "$body"

          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body-file "$body" || true
          else
            gh issue create \
              --title "Synchronizace úřední desky selhala" \
              --body-file "$body" \
              --assignee honza-kasik || true
          fi
